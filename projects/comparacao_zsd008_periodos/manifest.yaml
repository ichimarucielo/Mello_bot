id: comparacao_zsd008_periodos
name: Comparacao ZSD008 entre Periodos
category: financeiro
description: 'Recebo diariamente dois documentos:

  zsd008 SAP faturamento da stelo xslx

  prefeitura csv

  Preciso que todas as nfs estejam presentes na prefeitura, as que não tiverem tem
  que ser dadas como divergencia em um nova pagina.

  Ou seja, 2 paginas:

  1 - Divergentes, não conciliadas

  2 - Conciliadas, geral

  a referencia é a prefeitura.'
project_path: projects/comparacao_zsd008_periodos
timeout_seconds: 1800
entrypoint:
  script: src/main.py
required_files:
- id: zsd008
  display_name: ZSD008
  accepted_extensions:
  - xlsx
  critical_columns:
  - Nº Nota Fiscal
  - Valor Bruto
  required_columns:
  - Razão Social
  - CNPJ
  cli_argument: --zsd008
- id: prefeitura_nfse
  display_name: Prefeitura NFS-e
  accepted_extensions:
  - csv
  critical_columns:
  - Numero NF
  - Numero RPS
  - CNPJ
  - Valor Serviço
  required_columns:
  - Data NF
  - Data RPS
  - Numero NF
  - Numero RPS
  - CNPJ
  - Tomador
  - Código Servico
  - Valor Serviço
  - Total NF
  cli_argument: --prefeitura-nfse
steps:
- operation: normalize
  description: ''
  parameters:
    key: null
  confidence: baixa
  pending_confirmation: []
- operation: reconcile
  description: ''
  parameters:
    key:
    - Nº Nota Fiscal
    - Numero NF
  confidence: alta
  pending_confirmation: []
pipeline:
  operations:
  - operation: normalize
    description: ''
    parameters:
      key: null
    confidence: baixa
    pending_confirmation: []
  - operation: reconcile
    description: ''
    parameters:
      key:
      - Nº Nota Fiscal
      - Numero NF
    confidence: alta
    pending_confirmation: []
outputs:
- conciliacao.xlsx
- divergencias.xlsx
tags: []
pattern: reconciliation
output_mode: separate
