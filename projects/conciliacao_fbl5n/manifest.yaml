  - Nome 1
  - Valor Aging
  required_columns:
  - Conta do Razão
  - Tipo de documento
  - Conta
  - Referência
  - Nº ID fiscal 1
  - Nome 1
  - Data de lançamento
  - Data do documento
  - Nº documento
  - Vencimento líquido
