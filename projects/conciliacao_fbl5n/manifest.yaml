  - xlsx
  critical_columns:
  - Nº documento
  - Nome 1
  - Mont.moeda doc.
  required_columns:
  - Conta do Razão
  - Tipo de documento
  - Conta
  - Referência
  - Nº ID fiscal 1
  - Nome 1
  - Data de lançamento
  - Data do documento
  - Nº documento
  - Vencimento líquido
