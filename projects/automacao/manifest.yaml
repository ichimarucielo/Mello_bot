id: automacao
name: Automacao Gerada
category: operacional
description: Recebo diariamente um relatório FS10N exportado do SAP e um relatório
  de Billing. Preciso conciliar os documentos e gerar um Excel contendo conciliados,
  divergentes, apenas SAP e apenas Billing.
project_path: projects/automacao
timeout_seconds: 1800
entrypoint:
  script: src/main.py
required_files:
- id: faturamento
  display_name: Faturamento
  accepted_extensions:
  - xlsx
  required_columns:
  - ID
  cli_argument: --faturamento
- id: sap
  display_name: SAP
  accepted_extensions:
  - xlsx
  required_columns:
  - ID
  cli_argument: --sap
outputs:
- resultado.xlsx
tags: []
